name: CI
on:
  push: { branches: [main, master] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cài & build frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Cài backend
        working-directory: server
        run: npm ci
      - name: Chạy test tự động
        working-directory: server
        run: npm test
      - name: Kiểm tra cú pháp toàn bộ module server
        working-directory: server
        run: for f in *.js routes/*.js; do node --check "$f" || exit 1; done
      - name: Build Docker image
        run: docker build -t mbfs-cloud-portal:ci .
