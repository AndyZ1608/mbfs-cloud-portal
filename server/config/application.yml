# CMP application/service integrations.
billing:
  # Billing is a first-class portal feature. Disable explicitly to hide it.
  enabled: true

  # Billing service internal REST API.
  # Set to the real Billing service URL before using Billing data.
  # An empty URL keeps the menu visible and shows an unavailable state.
  base_url: ""

  timeout_seconds: 10

# Read-only, CMP-backend-only Monitoring integration. The admin API key is
# supplied separately through MONITORING_API_KEY; never put it in this file.
monitoring:
  enabled: true
  base_url: "http://100.64.64.181:8080"
  timeout_seconds: 15
